# Sobe tudo em modo desenvolvimento (hot reload com o código da pasta):
#   cp .env.example .env   # preencha usuário/senha do MongoDB
#   docker compose up -d --build
services:
  mongo:
    image: mongo:7
    container_name: employees-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?defina no .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?defina no .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: employees-api
    restart: unless-stopped
    environment:
      PORT: "3333"
      MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/employees?authSource=admin
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
    ports:
      - "${API_PORT:-3333}:3333"
    volumes:
      - ./apps/api:/usr/src/app/apps/api
      - /usr/src/app/apps/api/node_modules
      - /usr/src/app/apps/api/dist
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3333/employees').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: employees-web
    restart: unless-stopped
    environment:
      # Usada pelo navegador: aponta para a porta da API publicada no host.
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3333}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/usr/src/app/apps/web
      - /usr/src/app/apps/web/node_modules
      - /usr/src/app/apps/web/.next
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo-data:
