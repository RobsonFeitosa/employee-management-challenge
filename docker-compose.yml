services:
  mongo:
    image: mongo:7
    container_name: employees-mongo
    restart: unless-stopped
    env_file: .env
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - ./infra/mongo/data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
